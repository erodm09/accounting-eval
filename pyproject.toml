[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "accounting-eval"
version = "0.1.0"
description = "A small eval of accounting problems for LLMs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[tool.setuptools.package-data]
accounting_eval = ["data/*.jsonl"]
